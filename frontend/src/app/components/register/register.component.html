<div class="register-container">
  <div class="register-card">
    <div class="register-form-section">
      <div class="brand-header">
        <span class="brand-name">Spend<span>Wise</span></span>
      </div>

      <div class="register-titles">
        <h2>Crear Cuenta</h2>
        <p>Comienza a administrar tus finanzas de manera inteligente.</p>
      </div>

      <!-- Mensajes de feedback -->
      <div *ngIf="errorMessage" style="color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px;">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" style="color: #2ecc71; font-size: 0.85rem; margin-bottom: 10px;">
        {{ successMessage }}
      </div>

      <form class="form-group" (ngSubmit)="onRegister()">
        <div class="input-wrapper">
          <label>Correo electrónico</label>
          <input type="email" [(ngModel)]="credentials.email" name="email" placeholder="nombre@ejemplo.com" required />
        </div>
        
        <div class="input-wrapper">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="credentials.password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-register">REGISTRARSE</button>
      </form>

      <div class="register-footer">
        <span>¿Ya tienes una cuenta?</span> <a routerLink="/login">Inicia sesión</a>
      </div>
    </div>
  </div>
</div>
