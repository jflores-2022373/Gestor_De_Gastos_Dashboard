<div class="spendwise-login-wrapper">
  <h2>SpendWise</h2>
  
  <form (ngSubmit)="onLogin()">
    <div>
      <label>Correo Electrónico</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="admin@.com">
    </div>

    <div>
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" required placeholder="123">
    </div>

    <button type="submit">Iniciar Sesión</button>
  </form>

  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
</div>
